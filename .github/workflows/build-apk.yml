name: Build MH NoteMate APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android project
        shell: bash
        run: |
          if [ -f MHNoteMate_AndroidStudio_Project.zip ]; then
            unzip -q -o MHNoteMate_AndroidStudio_Project.zip
            if [ -d MHNoteMate ]; then
              shopt -s dotglob
              cp -r MHNoteMate/* .
            fi
          fi
          if [ -f mh_notemate_project_source.tar.gz ]; then
            tar -xzf mh_notemate_project_source.tar.gz
          fi
          test -f settings.gradle || { echo "Project files are not yet uploaded"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build installable APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MH-NoteMate-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
